<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OfferLabell | Online Deals</title>
  <link rel="icon" href="/favicon.png" type="image/png" sizes="96x96">
  <meta name="description" content="Find the best prices and promotions on products, all in one place.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f8efd9;
      color: #102f2b;
      font-family: system-ui, sans-serif;
    }
    main {
      display: grid;
      grid-template-columns: minmax(0, 4fr) minmax(0, 6fr);
      align-items: center;
      gap: clamp(2rem, 5vw, 5rem);
      width: min(100%, 94rem);
      min-height: 100svh;
      margin-inline: auto;
      padding: clamp(1.25rem, 5vw, 5rem);
    }
    .brand {
      margin: 0 0 1.75rem;
      color: #17614f;
      font-size: 0.875rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font: 500 clamp(3rem, 6vw, 6.75rem)/0.97 Georgia, serif;
      letter-spacing: -0.055em;
      text-wrap: balance;
    }
    h1 span { color: #9b4127; }
    .description {
      max-width: 31ch;
      margin: 1.5rem 0 0;
      font-size: clamp(1rem, 1.6vw, 1.25rem);
      line-height: 1.55;
    }
    img {
      display: block;
      width: 100%;
      aspect-ratio: 5 / 4;
      object-fit: cover;
      border-radius: 1.5rem;
      background: #b8dcd1;
    }
    @media (max-width: 48rem) {
      main {
        grid-template-columns: 1fr;
        align-content: center;
        padding-block: 2.5rem;
      }
      img { aspect-ratio: 4 / 3; }
    }
  </style>
  <!-- GOOGLE ADS: cole aqui a tag base, se ainda nao estiver instalada nesta pagina. -->
</head>
<body>
  <main>
    <section aria-labelledby="headline">
      <p class="brand">OfferLabell</p>
      <h1 id="headline">Great deals.<br><span>One place.</span></h1>
      <p class="description">Find the best prices and promotions on products, all in one place.</p>
    </section>
    <img src="./offerlabell-beach.webp" alt="A smiling couple walks along a tropical beach beside turquoise water.">
  </main>
</body>
</html>

<!doctype html>
<html lang="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <meta name="description" content="">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      background-color: #0e141b;
      color: #111111;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .presell {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      width: 100%;
      display: flex;
      background-color: #0e141b;
      background-image:
        radial-gradient(circle at 50% 30%, rgba(34, 62, 54, 0.58) 0%, rgba(14, 20, 27, 0.96) 72%);
      overflow: hidden;
    }

    .oferta-link {
      position: relative;
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      padding: clamp(1.25rem, 4vw, 3rem) 1rem 4.25rem;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      isolation: isolate;
      outline: none;
    }

    .oferta-link:focus-visible {
      outline: 3px solid #f59e0b;
      outline-offset: -6px;
    }

    .fundo-midia {
      position: absolute;
      inset: 0;
      z-index: -2;
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .fundo-imagem {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      color: transparent;
    }

    .fundo-imagem[hidden] {
      display: none;
    }

    .camada-escura {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 48%, rgba(8, 13, 19, 0.34) 0%, rgba(8, 13, 19, 0.64) 100%),
        linear-gradient(180deg, rgba(8, 13, 19, 0.38) 0%, rgba(8, 13, 19, 0.58) 100%);
    }

    .cartao {
      width: 100%;
      max-width: 30.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: clamp(1.85rem, 4.5vw, 2.4rem) clamp(1.35rem, 4vw, 2rem);
      border-radius: 1rem;
      background-color: #ffffff;
      color: #111111;
      box-shadow: 0 22px 54px rgba(0, 0, 0, 0.3);
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .oferta-link:focus-visible .cartao {
      box-shadow: 0 0 0 3px #f59e0b, 0 22px 54px rgba(0, 0, 0, 0.38);
    }

    .titulo {
      font-size: clamp(1.6rem, 4.2vw, 2rem);
      font-weight: 700;
      line-height: 1.18;
      letter-spacing: -0.02em;
      color: #000000;
      text-wrap: balance;
    }

    .texto {
      max-width: 24.5rem;
      margin-top: 0.85rem;
      font-size: 0.96875rem;
      font-weight: 400;
      line-height: 1.5;
      color: #262626;
      text-wrap: balance;
    }

    .botao {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 22rem;
      min-height: 3.375rem;
      margin-top: 1.55rem;
      padding: 0.85rem 1.5rem;
      border: 1.5px solid #000000;
      border-radius: 0.5rem;
      background-color: #000000;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.005em;
      transition: background-color 150ms ease, border-color 150ms ease, transform 150ms ease;
    }

    .oferta-link:hover .botao {
      background-color: #1f1f1f;
      border-color: #1f1f1f;
      transform: translateY(-1px);
    }

    .oferta-link:active .botao {
      transform: translateY(0);
    }

    .oferta-link:focus-visible .botao {
      box-shadow: 0 0 0 3px #ffffff, 0 0 0 6px #000000;
    }

    .aviso {
      max-width: 24rem;
      margin-top: 0.95rem;
      font-size: 0.8125rem;
      line-height: 1.45;
      color: #525252;
    }

    /* Botão discreto fora da área clicável da oferta para revisar preferências */
    .cookies-gatilho {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      z-index: 20;
      appearance: none;
      padding: 0.5rem 0.85rem;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 0.5rem;
      background-color: rgba(14, 20, 27, 0.82);
      color: #f8fafc;
      font: inherit;
      font-size: 0.8125rem;
      font-weight: 500;
      line-height: 1.2;
      cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: background-color 140ms ease, border-color 140ms ease;
    }

    .cookies-gatilho:hover {
      background-color: rgba(14, 20, 27, 0.95);
      border-color: rgba(255, 255, 255, 0.45);
    }

    .cookies-gatilho:focus-visible {
      outline: 2px solid #f59e0b;
      outline-offset: 2px;
    }

    .cookies-gatilho[hidden] {
      display: none;
    }

    /* Diálogo funcional de Cookie Settings (fora do link da oferta) */
    .cookies-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background-color: rgba(8, 13, 19, 0.52);
    }

    .cookies-backdrop[hidden] {
      display: none;
    }

    .cookies-card {
      position: relative;
      width: 100%;
      max-width: 30.5rem;
      padding: 2.15rem 1.75rem 1.75rem;
      border-radius: 1rem;
      background-color: #ffffff;
      color: #111111;
      text-align: center;
      box-shadow: 0 22px 54px rgba(0, 0, 0, 0.32);
    }

    .cookies-fechar {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      border: none;
      border-radius: 999px;
      background-color: transparent;
      color: #262626;
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      transition: background-color 140ms ease, color 140ms ease;
    }

    .cookies-fechar:hover {
      background-color: #f1f5f9;
      color: #000000;
    }

    .cookies-fechar:focus-visible {
      outline: 2px solid #000000;
      outline-offset: 2px;
    }

    .cookies-titulo {
      font-size: clamp(1.5rem, 4vw, 1.85rem);
      font-weight: 700;
      line-height: 1.18;
      letter-spacing: -0.02em;
      color: #000000;
      text-wrap: balance;
    }

    .cookies-texto {
      max-width: 25rem;
      margin: 0.9rem auto 0;
      font-size: 0.9375rem;
      font-weight: 400;
      line-height: 1.48;
      color: #262626;
    }

    .cookies-acoes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-top: 1.65rem;
    }

    .cookies-btn {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 3.375rem;
      padding: 0.85rem 1rem;
      border-radius: 0.5rem;
      font: inherit;
      font-size: 0.975rem;
      font-weight: 700;
      line-height: 1.2;
      cursor: pointer;
      transition: background-color 140ms ease, border-color 140ms ease;
    }

    .cookies-btn:focus-visible {
      outline: 2px solid #f59e0b;
      outline-offset: 2px;
    }

    .cookies-btn--aceitar {
      background-color: #000000;
      border: 1.5px solid #000000;
      color: #ffffff;
    }

    .cookies-btn--aceitar:hover {
      background-color: #1f1f1f;
      border-color: #1f1f1f;
    }

    .cookies-btn--recusar {
      background-color: #eef1f0;
      border: 1.5px solid #262626;
      color: #000000;
    }

    .cookies-btn--recusar:hover {
      background-color: #e2e7e5;
    }

    @media (max-width: 380px) {
      .cookies-acoes {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cartao,
      .botao,
      .cookies-btn,
      .cookies-fechar,
      .cookies-gatilho {
        transition: none;
      }

      .oferta-link:hover .botao {
        transform: none;
      }
    }
  </style>
  <script src="configuracoes.js"></script>
</head>
<body>
  <main class="presell">
    <a
      id="link-oferta"
      class="oferta-link"
      href="#"
      rel="sponsored noopener"
    >
      <picture class="fundo-midia">
        <source
          id="fonte-computador"
          media="(min-width: 768px)"
          srcset="imagens/computador.webp"
          type="image/webp"
        >
        <img
          id="imagem-fundo"
          class="fundo-imagem"
          src="imagens/celular.webp"
          alt=""
          loading="eager"
          decoding="async"
          fetchpriority="high"
        >
      </picture>

      <span class="camada-escura" aria-hidden="true"></span>

      <div class="cartao">
        <h1 id="titulo-oferta" class="titulo"></h1>
        <p id="texto-oferta" class="texto"></p>
        <span id="texto-botao" class="botao"></span>
        <p id="aviso-afiliado" class="aviso"></p>
      </div>
    </a>
  </main>

  <button id="btn-abrir-cookies" type="button" class="cookies-gatilho" hidden></button>

  <div
    id="modal-cookies"
    class="cookies-backdrop"
    role="dialog"
    aria-modal="true"
    aria-labelledby="titulo-cookies"
    aria-describedby="texto-cookies"
    hidden
  >
    <div class="cookies-card">
      <button id="btn-cookies-fechar" type="button" class="cookies-fechar" aria-label="">
        <span aria-hidden="true">&#215;</span>
      </button>
      <h2 id="titulo-cookies" class="cookies-titulo"></h2>
      <p id="texto-cookies" class="cookies-texto"></p>
      <div class="cookies-acoes">
        <button id="btn-cookies-aceitar" type="button" class="cookies-btn cookies-btn--aceitar"></button>
        <button id="btn-cookies-recusar" type="button" class="cookies-btn cookies-btn--recusar"></button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      var cfg = typeof CONFIG !== "undefined" && CONFIG ? CONFIG : {};
      var adsCfg = cfg.googleAds && typeof cfg.googleAds === "object" ? cfg.googleAds : {};
      var cookiesCfg = cfg.cookies && typeof cfg.cookies === "object" ? cfg.cookies : {};
      var textosMapa = cfg.textos && typeof cfg.textos === "object" ? cfg.textos : {};

      var idioma = typeof cfg.idioma === "string" && cfg.idioma.trim() ? cfg.idioma.trim() : "en-US";
      var idiomaBase = idioma.split("-")[0];
      var pacoteIdioma = textosMapa[idioma] || textosMapa[idiomaBase] || {};
      var textosCookies = pacoteIdioma.cookies && typeof pacoteIdioma.cookies === "object" ? pacoteIdioma.cookies : {};

      var produto = typeof cfg.produto === "string" ? cfg.produto.trim() : "";
      var titulo = lerTexto(cfg.titulo, pacoteIdioma.titulo, produto);
      var texto = lerTexto(cfg.texto, pacoteIdioma.texto, "");
      var textoBotao = lerTexto(cfg.textoBotao, pacoteIdioma.textoBotao, "");
      var avisoAfiliado = lerTexto(cfg.avisoAfiliado, pacoteIdioma.avisoAfiliado, "");
      var imagemCelular = lerTexto(cfg.imagemCelular, "", "imagens/celular.webp");
      var imagemComputador = lerTexto(cfg.imagemComputador, "", "imagens/computador.webp");
      var linkAfiliado = lerTexto(cfg.linkAfiliado, "", "");

      var cookiesAtivo = cookiesCfg.ativo !== false;
      var adsAtivo = adsCfg.ativo === true;
      var adsId = typeof adsCfg.id === "string" ? adsCfg.id.trim() : "";
      var adsRotulo = typeof adsCfg.rotuloConversao === "string" ? adsCfg.rotuloConversao.trim() : "";
      var tempoLimiteRaw = Number(adsCfg.tempoLimiteMs);
      var tempoLimiteMs = tempoLimiteRaw > 0 ? Math.min(Math.max(tempoLimiteRaw, 150), 1500) : 450;

      var CHAVE_CONSENTIMENTO = "presell_cookie_consent_v1";
      var gtagCarregado = false;
      var eventoEnviadoNoClique = false;

      function lerTexto(direto, traduzido, padrao) {
        if (typeof direto === "string" && direto.trim()) {
          return direto.trim();
        }
        if (typeof traduzido === "string" && traduzido.trim()) {
          return traduzido.trim();
        }
        return padrao;
      }

      function lerConsentimento() {
        try {
          return window.localStorage.getItem(CHAVE_CONSENTIMENTO);
        } catch (e) {
          return null;
        }
      }

      function salvarConsentimento(valor) {
        try {
          window.localStorage.setItem(CHAVE_CONSENTIMENTO, valor);
        } catch (e) {
          // Ignora indisponibilidade de localStorage
        }
      }

      document.documentElement.lang = idioma;
      document.title = titulo || produto;

      var metaDescricao = document.querySelector('meta[name="description"]');
      if (metaDescricao) {
        metaDescricao.setAttribute("content", texto);
      }

      var linkEl = document.getElementById("link-oferta");
      var fonteComputadorEl = document.getElementById("fonte-computador");
      var imagemFundoEl = document.getElementById("imagem-fundo");
      var tituloEl = document.getElementById("titulo-oferta");
      var textoEl = document.getElementById("texto-oferta");
      var textoBotaoEl = document.getElementById("texto-botao");
      var avisoEl = document.getElementById("aviso-afiliado");

      if (tituloEl) {
        tituloEl.textContent = titulo;
        tituloEl.hidden = !titulo;
      }

      if (textoEl) {
        textoEl.textContent = texto;
        textoEl.hidden = !texto;
      }

      if (textoBotaoEl) {
        textoBotaoEl.textContent = textoBotao;
        textoBotaoEl.hidden = !textoBotao;
      }

      if (avisoEl) {
        avisoEl.textContent = avisoAfiliado;
        avisoEl.hidden = !avisoAfiliado;
      }

      if (linkEl && linkAfiliado) {
        linkEl.setAttribute("href", linkAfiliado);
      }

      if (fonteComputadorEl && fonteComputadorEl.getAttribute("srcset") !== imagemComputador) {
        fonteComputadorEl.setAttribute("srcset", imagemComputador);
      }

      if (imagemFundoEl) {
        imagemFundoEl.addEventListener("error", function () {
          imagemFundoEl.hidden = true;
        });

        if (imagemFundoEl.getAttribute("src") !== imagemCelular) {
          imagemFundoEl.setAttribute("src", imagemCelular);
        }

        if (imagemFundoEl.complete && imagemFundoEl.naturalWidth === 0) {
          imagemFundoEl.hidden = true;
        }
      }

      function consentimentoAutorizado() {
        if (!cookiesAtivo) {
          return adsCfg.autorizado !== false;
        }
        return lerConsentimento() === "granted";
      }

      function rastreamentoPermitido() {
        return Boolean(adsAtivo && adsId && adsRotulo && consentimentoAutorizado());
      }

      function carregarGoogleAds() {
        if (gtagCarregado || !rastreamentoPermitido()) {
          return;
        }

        gtagCarregado = true;
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () {
          window.dataLayer.push(arguments);
        };

        window.gtag("js", new Date());
        window.gtag("config", adsId);

        var script = document.createElement("script");
        script.async = true;
        script.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(adsId);
        document.head.appendChild(script);
      }

      // Diálogo real de Cookie Settings (separado do link da oferta)
      var modalCookies = document.getElementById("modal-cookies");
      var btnAbrirCookies = document.getElementById("btn-abrir-cookies");
      var tituloCookiesEl = document.getElementById("titulo-cookies");
      var textoCookiesEl = document.getElementById("texto-cookies");
      var btnAceitarEl = document.getElementById("btn-cookies-aceitar");
      var btnRecusarEl = document.getElementById("btn-cookies-recusar");
      var btnFecharEl = document.getElementById("btn-cookies-fechar");

      if (cookiesAtivo && modalCookies) {
        var cookieTitulo = lerTexto(cookiesCfg.titulo, textosCookies.titulo, "Cookie Settings");
        var cookieTexto = lerTexto(cookiesCfg.texto, textosCookies.texto, "");
        var cookieAceitar = lerTexto(cookiesCfg.aceitar, textosCookies.aceitar, "Yes, I accept");
        var cookieRecusar = lerTexto(cookiesCfg.recusar, textosCookies.recusar, "No, I do not accept");
        var cookieFechar = lerTexto(cookiesCfg.fechar, textosCookies.fechar, "Close");
        var cookieGerenciar = lerTexto(cookiesCfg.gerenciar, textosCookies.gerenciar, cookieTitulo);

        if (tituloCookiesEl) tituloCookiesEl.textContent = cookieTitulo;
        if (textoCookiesEl) textoCookiesEl.textContent = cookieTexto;
        if (btnAceitarEl) btnAceitarEl.textContent = cookieAceitar;
        if (btnRecusarEl) btnRecusarEl.textContent = cookieRecusar;
        if (btnFecharEl) btnFecharEl.setAttribute("aria-label", cookieFechar);
        if (btnAbrirCookies) btnAbrirCookies.textContent = cookieGerenciar;

        function abrirModalCookies() {
          modalCookies.hidden = false;
          if (btnAbrirCookies) btnAbrirCookies.hidden = true;
          if (btnAceitarEl) btnAceitarEl.focus();
        }

        function fecharModalCookies(escolha) {
          if (escolha === "granted" || escolha === "denied") {
            salvarConsentimento(escolha);
          }
          modalCookies.hidden = true;
          if (btnAbrirCookies) btnAbrirCookies.hidden = false;
          if (escolha === "granted") {
            carregarGoogleAds();
          }
        }

        var escolhaSalva = lerConsentimento();
        if (escolhaSalva === "granted" || escolhaSalva === "denied") {
          modalCookies.hidden = true;
          if (btnAbrirCookies) btnAbrirCookies.hidden = false;
        } else {
          modalCookies.hidden = false;
          if (btnAbrirCookies) btnAbrirCookies.hidden = true;
        }

        if (btnAceitarEl) {
          btnAceitarEl.addEventListener("click", function () {
            fecharModalCookies("granted");
          });
        }

        if (btnRecusarEl) {
          btnRecusarEl.addEventListener("click", function () {
            fecharModalCookies("denied");
          });
        }

        if (btnFecharEl) {
          btnFecharEl.addEventListener("click", function () {
            fecharModalCookies("denied");
          });
        }

        if (btnAbrirCookies) {
          btnAbrirCookies.addEventListener("click", function () {
            abrirModalCookies();
          });
        }

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && !modalCookies.hidden) {
            fecharModalCookies("denied");
          }
        });
      }

      carregarGoogleAds();

      window.addEventListener("pageshow", function () {
        eventoEnviadoNoClique = false;
      });

      if (linkEl) {
        linkEl.addEventListener("click", function (event) {
          var destino = linkEl.getAttribute("href");
          if (!destino || destino === "#") {
            event.preventDefault();
            return;
          }

          if (!rastreamentoPermitido()) {
            return;
          }

          var sendTo = adsId + "/" + adsRotulo;
          var aberturaNovaAba =
            event.defaultPrevented ||
            event.button !== 0 ||
            event.metaKey ||
            event.ctrlKey ||
            event.shiftKey ||
            event.altKey;

          if (aberturaNovaAba) {
            if (!eventoEnviadoNoClique && typeof window.gtag === "function") {
              eventoEnviadoNoClique = true;
              try {
                window.gtag("event", "conversion", {
                  send_to: sendTo,
                  transport_type: "beacon"
                });
              } catch (e) {
                // Segue abertura nativa em nova aba
              }
              window.setTimeout(function () {
                eventoEnviadoNoClique = false;
              }, 1000);
            }
            return;
          }

          event.preventDefault();

          if (eventoEnviadoNoClique) {
            return;
          }
          eventoEnviadoNoClique = true;

          var redirecionou = false;
          var temporizador = null;

          function seguirParaOferta() {
            if (redirecionou) return;
            redirecionou = true;
            if (temporizador) {
              window.clearTimeout(temporizador);
            }
            window.location.assign(destino);
          }

          temporizador = window.setTimeout(seguirParaOferta, tempoLimiteMs);

          if (typeof window.gtag === "function") {
            try {
              window.gtag("event", "conversion", {
                send_to: sendTo,
                event_callback: seguirParaOferta,
                event_timeout: tempoLimiteMs
              });
            } catch (e) {
              seguirParaOferta();
            }
          } else {
            seguirParaOferta();
          }
        });
      }
    })();
  </script>
</body>
</html>

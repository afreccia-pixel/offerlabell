name: Gerar presell
on:
  workflow_dispatch:
    inputs:
      produto:
        description: Nome do produto
        required: true
      afiliado:
        description: Link HTTPS de afiliado
        required: true
      idioma:
        description: Idioma da página
        type: choice
        options:
          - en
          - de
          - pt
        default: en
permissions:
  contents: read
jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==12.2.0'
      - name: Pesquisar e criar o rascunho
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRODUTO: ${{ inputs.produto }}
          AFILIADO: ${{ inputs.afiliado }}
          IDIOMA: ${{ inputs.idioma }}
        run: python tools/gerar_presell.py --language "$IDIOMA" -- "$PRODUTO" "$AFILIADO"
      - uses: actions/upload-artifact@v4
        with:
          name: presell-para-revisao
          path: drafts/
          if-no-files-found: error


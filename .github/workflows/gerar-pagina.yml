name: Gerar Página
on:
  workflow_dispatch:
    inputs:
      dados_da_pagina:
        description: Cole os dados copiados de https://offerlabell.com/gerar-pagina/
        type: string
        required: false
      produto:
        description: Nome do produto
        required: false
      afiliado:
        description: Link HTTPS de afiliado
        required: false
      imagem:
        description: URL HTTPS da foto do produto (opcional)
        required: false
      imagem_colada:
        description: Código de uma única imagem (opcional).
        type: string
        required: false
      idioma:
        description: Idioma da página
        type: choice
        options:
          - en
          - de
          - pt
        default: en
permissions:
  contents: read
jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==12.2.0'
      - name: Pesquisar e criar o rascunho
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DADOS_DA_PAGINA: ${{ inputs.dados_da_pagina }}
          PRODUTO: ${{ inputs.produto }}
          AFILIADO: ${{ inputs.afiliado }}
          IDIOMA: ${{ inputs.idioma }}
          IMAGEM_COLADA: ${{ inputs.imagem_colada }}
          IMAGEM: ${{ inputs.imagem }}
        run: |
          args=(--language "$IDIOMA")
          if [[ -n "$IMAGEM" ]]; then
            args+=(--product-image "$IMAGEM")
          fi
          python tools/gerar_pagina.py "${args[@]}" -- "$PRODUTO" "$AFILIADO"
      - uses: actions/upload-artifact@v4
        with:
          name: pagina-para-revisao
          path: drafts/
          if-no-files-found: error


name: Gerar Página
on:
  workflow_dispatch:
    inputs:
      dados_da_pagina:
        description: Cole os dados copiados de https://offerlabell.com/gerar-pagina/
        type: string
        required: true
permissions:
  contents: read
jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==12.2.0'
      - name: Pesquisar e criar o rascunho
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DADOS_DA_PAGINA: ${{ inputs.dados_da_pagina }}
        run: python tools/gerar_pagina.py -- "" ""
      - uses: actions/upload-artifact@v4
        with:
          name: pagina-para-revisao
          path: drafts/
          if-no-files-found: error


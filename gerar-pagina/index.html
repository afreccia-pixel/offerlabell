<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="96x96">
  <title>Gerar Página | OfferLabell</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f7f5; color: #173e30; font: 1rem/1.5 system-ui, sans-serif; }
    main { width: min(44rem, calc(100% - 2rem)); margin: clamp(1rem, 5vw, 3rem) auto; }
    form { display: grid; gap: 1rem; padding: clamp(1rem, 4vw, 2rem); border: 1px solid #ccdcd3; border-radius: 1rem; background: white; }
    label { display: block; font-weight: 650; }
    input, select, textarea { display: block; width: 100%; margin-top: .3rem; padding: .65rem; font: inherit; color: inherit; border: 1px solid #709489; border-radius: .4rem; }
    input[type="file"] { border-style: dashed; }
    .images { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: 1rem; }
    .images img { display: block; max-width: 100%; max-height: 11rem; margin-top: .65rem; }
    [hidden], .images img[hidden] { display: none; }
    button { justify-self: start; padding: .7rem 1rem; border: 0; border-radius: .45rem; background: #1d523d; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    a { color: #13533d; font-weight: 650; }
    .hint, #status { margin: 0; }
  </style>
</head>
<body>
<main>
  <h1>Gerar Página</h1>
  <form id="generator">
    <label for="produto">Nome do produto
      <input id="produto" name="produto" maxlength="100" required>
    </label>
    <label for="afiliado">Link do afiliado
      <input id="afiliado" name="afiliado" type="url" maxlength="2000" placeholder="https://" required>
    </label>
    <label for="idioma">Idioma da página
      <select id="idioma" name="idioma">
        <option value="en">Inglês</option>
        <option value="de">Alemão</option>
        <option value="pt">Português</option>
      </select>
    </label>
    <div class="images">
      <div>
        <label for="tela">Imagem tela</label>
        <input id="tela" type="file" accept=".jpg,.jpeg,image/jpeg" required>
        <small>JPG para a tela principal da página.</small>
        <img id="tela-preview" alt="Prévia da imagem da tela" hidden>
      </div>
      <div>
        <label for="imagem_produto">Imagem produto</label>
        <input id="imagem_produto" type="file" accept=".jpg,.jpeg,image/jpeg" required>
        <small>JPG do produto com o nome visível, para a miniatura da busca.</small>
        <img id="imagem_produto-preview" alt="Prévia da imagem do produto" hidden>
      </div>
    </div>
    <button id="copy" type="submit">Copiar dados da página</button>
    <label id="manual" for="code" hidden>Dados para copiar manualmente
      <textarea id="code" readonly rows="3"></textarea>
    </label>
    <p id="status" role="status"></p>
  </form>
  <p>Abra <a href="https://github.com/afreccia-pixel/offerlabell/actions/workflows/gerar-pagina.yml">Gerar Página no GitHub</a>, clique em <strong>Run workflow</strong> e cole os dados no campo <strong>dados_da_pagina</strong>.</p>
</main>
<script type="module">
  const form = document.querySelector('#generator');
  const button = document.querySelector('#copy');
  const status = document.querySelector('#status');
  const manual = document.querySelector('#manual');
  const output = document.querySelector('#code');

  for (const id of ['tela', 'imagem_produto']) {
    const input = document.querySelector('#' + id);
    const preview = document.querySelector('#' + id + '-preview');
    let previewUrl;
    function show(file) {
      URL.revokeObjectURL(previewUrl);
      preview.hidden = !file;
      if (file) {
        previewUrl = URL.createObjectURL(file);
        preview.src = previewUrl;
      } else {
        preview.removeAttribute('src');
      }
    }
    input.addEventListener('change', () => show(input.files[0]));
  }

  async function encode(file) {
    const signature = new Uint8Array(await file.slice(0, 3).arrayBuffer());
    if (!/\.jpe?g$/i.test(file.name) || signature[0] !== 255 || signature[1] !== 216 || signature[2] !== 255) {
      throw new Error('Selecione um arquivo JPG válido.');
    }
    const bitmap = await createImageBitmap(file);
    try {
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      for (const edge of [1200, 1000, 800, 640, 480, 320, 240]) {
        const scale = Math.min(1, edge / Math.max(bitmap.width, bitmap.height));
        canvas.width = Math.max(1, Math.round(bitmap.width * scale));
        canvas.height = Math.max(1, Math.round(bitmap.height * scale));
        context.fillStyle = '#fff';
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        const code = canvas.toDataURL('image/jpeg', 0.8);
        if (code.length <= 28000 && code.startsWith('data:image/jpeg;base64,')) return code;
      }
      throw new Error('Imagem excede o limite.');
    } finally {
      bitmap.close();
    }
  }

  form.addEventListener('input', () => { manual.hidden = true; });
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const name = form.elements.produto.value.trim();
    const affiliate = new URL(form.elements.afiliado.value);
    if (!name || affiliate.protocol !== 'https:' || affiliate.username || affiliate.password) {
      status.textContent = 'Informe o nome do produto e um link válido que comece com HTTPS.';
      return;
    }
    manual.hidden = true;
    button.disabled = true;
    status.textContent = 'Preparando dados…';
    try {
      const files = ['tela', 'imagem_produto'].map(id => document.getElementById(id).files[0]);
      const [tela, imagem_produto] = await Promise.all(files.map(encode));
      const data = JSON.stringify({ produto: name, afiliado: affiliate.href, idioma: form.elements.idioma.value, tela, imagem_produto });
      if (new TextEncoder().encode(data).length > 60000) {
        status.textContent = 'Os dados excedem o limite. Tente um link de afiliado mais curto.';
        return;
      }
      try {
        await navigator.clipboard.writeText(data);
        status.textContent = 'Dados copiados. Cole no campo dados_da_pagina do GitHub.';
      } catch {
        output.value = data;
        manual.hidden = false;
        output.select();
        status.textContent = 'Pressione Ctrl+C ou ⌘C para copiar os dados selecionados.';
      }
    } catch {
      status.textContent = 'Não foi possível ler uma das imagens. Selecione um JPG válido e tente novamente.';
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
